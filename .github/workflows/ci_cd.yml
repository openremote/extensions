name: CI/CD

on:
  # Push on main and release tags
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  # PR
  pull_request:
    branches:
      - main

  # Merge PRs using merge group
  merge_group:
    types: [checks_requested]
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        required: false
        description: Provide the OpenRemote version
        type: string
      is_release:
        required: false
        description: Whether a new extensions release is created
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openremote/openremote
          path: openremote
          ref: master
          sparse-checkout: profile
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21 and gradle cache
        id: java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Check if this is a publish event
        id: is_publish_event
        run: |
          echo "value=${{ github.repository == 'openremote/extensions' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}" >> "$GITHUB_OUTPUT"

      - name: Run Spotless check
        if: ${{ inputs.is_release != true }}
        timeout-minutes: 10
        run: ./gradlew spotlessCheck

      - name: Run installDist
        timeout-minutes: 20
        run: ./gradlew installDist

      - name: Run integration tests
        if: ${{ inputs.is_release != true }}
        timeout-minutes: 20
        run: |
          # Run build
          # Make temp dir with 777 mask as docker seems to run as root
          mkdir -pm 777 tmp

          # Start the dev-testing stack
          docker compose -f openremote/profile/dev-testing.yml up -d --no-build

          ./gradlew test

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        with:
          username: ${{ secrets._TEMP_DOCKERHUB_USER }}
          password: ${{ secrets._TEMP_DOCKERHUB_PASSWORD }}

      - name: Install QEMU
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: linux/amd64,linux/aarch64

      - name: Install Buildx
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build develop image
        if: ${{ steps.is_publish_event.outputs.value == 'true' && inputs.is_release != true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        timeout-minutes: 20
        with:
          context: deployment/build
          platforms: linux/amd64,linux/aarch64
          load: false
          push: true
          tags: openremote/manager:develop
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            QUALIFIER=develop
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Build manager image
        if: ${{ steps.is_publish_event.outputs.value == 'true' && inputs.is_release == true }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        timeout-minutes: 20
        with:
          context: deployment/build
          platforms: linux/amd64,linux/aarch64
          load: false
          push: true
          tags: |
            openremote/manager:${{ inputs.version }}
            openremote/manager:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            QUALIFIER=latest
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Publish to Maven Sonatype
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        timeout-minutes: 20
        run: ./gradlew publishToSonatype -PsigningKey=$MAVEN_SIGNING_KEY -PsigningPassword=$MAVEN_SIGNING_PASSWORD -PpublishUsername=$MAVEN_USERNAME -PpublishPassword=$MAVEN_PASSWORD
        env:
          MAVEN_SIGNING_KEY: ${{ secrets._TEMP_MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets._TEMP_MAVEN_SIGNING_PASSWORD }}
          MAVEN_USERNAME: ${{ secrets._TEMP_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets._TEMP_MAVEN_PASSWORD }}

      - name: Close and Verify Staging Repository
        if: ${{ inputs.is_release }}
        # This will poll the Sonatype API and wait until all validation rules pass.
        run: ./gradlew findSonatypeStagingRepository closeSonatypeStagingRepository -PpublishUsername=${{ secrets._TEMP_MAVEN_USERNAME }} -PpublishPassword=${{ secrets._TEMP_MAVEN_PASSWORD }}

      - name: Release to Maven Central Sonatype
        if: ${{ inputs.is_release }}
        run: ./gradlew findSonatypeStagingRepository releaseSonatypeStagingRepository -PpublishUsername=${{ secrets._TEMP_MAVEN_USERNAME }} -PpublishPassword=${{ secrets._TEMP_MAVEN_PASSWORD }}

      - name: Create OpenRemote deployment token
        id: deployment-token
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets._TEMP_CI_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets._TEMP_CI_AUTOMATION_APP_PRIVATE_KEY }}
          owner: openremote
          repositories: openremote
          permission-actions: write

      - name: Run deployment
        if: ${{ steps.is_publish_event.outputs.value == 'true' }}
        run: |
          if [ "$IS_RELEASE" == true ]; then
            gh workflow run deploy.yml -R openremote/openremote -f ENVIRONMENT="demo" -f MANAGER_TAG="latest" -f CLEAN_INSTALL="true"
          else 
            gh workflow run deploy.yml -R openremote/openremote -f ENVIRONMENT="staging" -f MANAGER_TAG="develop" -f CLEAN_INSTALL="true"
          fi
        env:
          GH_TOKEN: ${{ steps.deployment-token.outputs.token }}
          IS_RELEASE: ${{ inputs.is_release }}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/build/reports/tests"

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: "**/build/reports/jacoco/test/html"

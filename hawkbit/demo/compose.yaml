name: openremote-hawkbit-demo

volumes:
  proxy-data:
  manager-data:
  postgresql-data:
  hawkbitdb-data:
  hawkbit-artifact-data:

services:
  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPENREMOTE_HTTPS_PORT:-9443}:443"
    volumes:
      - proxy-data:/deployment
    environment:
      DOMAINNAME: localhost

  postgresql:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest-slim}
    restart: unless-stopped
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage

  keycloak:
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      KC_HOSTNAME: https://localhost:${OPENREMOTE_HTTPS_PORT:-9443}/auth

  manager:
    image: openremote/manager:${MANAGER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      hawkbit:
        condition: service_healthy
    environment:
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD:-secret}
      OR_HOSTNAME: localhost
      OR_SSL_PORT: ${OPENREMOTE_HTTPS_PORT:-9443}
      OR_DEV_MODE: "true"
      HAWKBIT_MANAGEMENT_API_URL: http://hawkbit:8080/hawkbit/rest/v1
      HAWKBIT_USERNAME: hawkbit
      HAWKBIT_PASSWORD: ${HAWKBIT_PASSWORD:-hawkbit}
      HAWKBIT_REALM: master
    volumes:
      - manager-data:/storage
      - ./.build/openremote-hawkbit-extension.jar:/opt/app/lib/openremote-hawkbit-extension.jar:ro

  hawkbit-ui:
    build:
      context: .
      dockerfile: hawkbit-ui/Dockerfile
      args:
        HAWKBIT_UI_VERSION: ${HAWKBIT_UI_VERSION:-develop}
    image: openremote/hawkbit-ui-demo:${HAWKBIT_UI_VERSION:-develop}
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAWKBIT_UI_PORT:-8004}:8004"
    environment:
      OR_MANAGER_URL: http://manager:8080
      KEYCLOAK_URL: http://keycloak:8080/auth
      OR_MANAGER_BROWSER_URL: https://localhost:${OPENREMOTE_HTTPS_PORT:-9443}
      KEYCLOAK_BROWSER_URL: https://localhost:${OPENREMOTE_HTTPS_PORT:-9443}/auth
      REALM: ${OPENREMOTE_REALM:-master}
      SERVICE_USER: ${HAWKBIT_UI_SERVICE_USER:-hawkbitui}
      SERVICE_USER_SECRET: ${HAWKBIT_UI_SERVICE_SECRET:-}
      SERVICE_ID: hawkbit-ui
      SERVICE_LABEL: Firmware Management
      SERVICE_ICON: package-variant-closed
      SERVICE_HOMEPAGE_URL: http://localhost:${HAWKBIT_UI_PORT:-8004}/services/hawkbit/ui/{realm}

  hawkbitdb:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest-slim}
    restart: unless-stopped
    environment:
      POSTGRES_DB: hawkbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - hawkbitdb-data:/var/lib/postgresql/data

  hawkbit:
    image: openremote/hawkbit-update-server:${HAWKBIT_VERSION:-develop}
    restart: unless-stopped
    depends_on:
      hawkbitdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAWKBIT_HTTP_PORT:-8083}:8080"
    healthcheck:
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 100
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/hawkbit"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hawkbitdb:5432/hawkbit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_DATABASE: POSTGRESQL
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HAWKBIT_DMF_RABBITMQ_ENABLED: "false"
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PORT: ${HAWKBIT_HTTP_PORT:-8083}
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_PROTOCOL: http
      HAWKBIT_ARTIFACT_URL_PROTOCOLS_DOWNLOAD_HTTP_REF: "{protocol}://{hostnameRequest}:{port}$${server.servlet.context-path}/{tenant}/controller/v1/{controllerId}/softwaremodules/{softwareModuleId}/artifacts/{artifactFileName}"
      HAWKBIT_SERVER_DDI_SECURITY_AUTHENTICATION_TARGETTOKEN_ENABLED: "true"
      SERVER_USE_FORWARD_HEADERS: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
      SERVER_SERVLET_CONTEXT_PATH: /hawkbit
      HAWKBIT_SECURITY_USER_ADMIN_TENANT: "#{null}"
      HAWKBIT_SECURITY_USER_ADMIN_PASSWORD: "#{null}"
      HAWKBIT_SECURITY_USER_ADMIN_ROLES: "#{null}"
      HAWKBIT_SECURITY_USER_HAWKBIT_TENANT: DEFAULT
      HAWKBIT_SECURITY_USER_HAWKBIT_PASSWORD: "{noop}${HAWKBIT_PASSWORD:-hawkbit}"
      HAWKBIT_SECURITY_USER_HAWKBIT_ROLES: TENANT_ADMIN
    volumes:
      - hawkbit-artifact-data:/opt/hawkbit/artifactrepo
